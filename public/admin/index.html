<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
  <link rel="stylesheet" href="/admin/cms.css" />
  <script>
    window.__cmsDiagLog = [];
    function cmsDiag(msg) { window.__cmsDiagLog.push(msg); console.error("[cms-diag]", msg); }
    function cmsDiagOverlay() {
      var box = document.getElementById("cms-diag");
      if (!box) {
        box = document.createElement("div");
        box.id = "cms-diag";
        box.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#111;color:#ff6b6b;border:1px solid #ff6b6b;border-radius:8px;padding:12px;font:12px/1.5 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto;";
        document.body.appendChild(box);
      }
      box.textContent = window.__cmsDiagLog.join("\n");
    }
    window.addEventListener("error", function (e) {
      cmsDiag("SCRIPT ERROR: " + (e.message || "unknown") + (e.filename ? " at " + e.filename + ":" + e.lineno : ""));
      cmsDiagOverlay();
    });
    window.addEventListener("unhandledrejection", function (e) {
      cmsDiag("PROMISE ERROR: " + (e.reason && (e.reason.message || e.reason)) + " ");
      cmsDiagOverlay();
    });
    (function () {
      window.__cmsPanel = [];
      var panel = document.createElement("div");
      panel.id = "cms-panel";
      panel.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:2147483000;background:#000;color:#7dffb0;border-bottom:1px solid #7dffb0;font:11px/1.5 monospace;padding:6px 10px;white-space:pre-wrap;max-height:30vh;overflow:auto;";
      document.addEventListener("DOMContentLoaded", function () {
        document.body.appendChild(panel);
      });
      window.__cmsPanelAdd = function (line) {
        window.__cmsPanel.push(new Date().toISOString().slice(11, 23) + " " + line);
        if (panel.parentNode) panel.textContent = window.__cmsPanel.join("\n");
      };
      window.__cmsPanelAdd("init: awaiting setup");

      var _origErr = console.error;
      console.error = function () {
        try {
          var _m = Array.prototype.slice.call(arguments, 0).map(function (a) {
            return typeof a === "string" ? a : (a && a.message) || String(a);
          }).join(" ");
          if (_m && _m.length) window.__cmsPanelAdd("CONSOLE-ERR: " + String(_m).slice(0, 220));
        } catch (e) {}
        _origErr.apply(console, arguments);
      };

      window.addEventListener("message", function (ev) {
        if (typeof ev.data !== "string" || ev.data.indexOf("authorization:") !== 0) return;
        var kind = "?";
        var raw = "";
        var m = ev.data.match(/^authorization:github:(success|error):(.*)$/);
        if (m) { kind = m[1]; raw = m[2]; }
        var originBase = window.__cmsBaseUrl || "?";
        window.__cmsPanelAdd("AUTH MSG from " + ev.origin + " | base_url=" + originBase + " | origin-ok=" + (ev.origin === originBase) + " | kind=" + kind);
        var payload = null;
        try { payload = JSON.parse(raw); } catch (e) { window.__cmsPanelAdd("auth payload parse failed"); }
        if (kind === "error" && payload && payload.message) window.__cmsPanelAdd("Auth error detail: " + payload.message);
        if (payload && payload.token) {
          fetch("https://api.github.com/repos/manishasharma1998/Portfolio", { headers: { Authorization: "Bearer " + payload.token } })
            .then(function (res) { window.__cmsPanelAdd("GH API status: " + res.status + (res.status === 200 ? " (token VALID)" : " (token REJECTED)")); })
            .catch(function (e) { window.__cmsPanelAdd("GH API fetch error: " + e.message); });
        }
        [4000, 8000, 15000].forEach(function (ms) {
          setTimeout(function () {
            var ncCount = document.querySelectorAll("[class*='nc-']").length;
            var txt = document.body ? document.body.innerText.slice(0, 220).replace(/\s+/g, " ") : "no-body";
            window.__cmsPanelAdd("@" + ms + "ms hash=" + location.hash + " nc-nodes=" + ncCount + " | " + txt);
          }, ms);
        });
      });
    })();
  </script>
</head>
<body>
  <noscript>Your browser needs JavaScript enabled to use the content manager.</noscript>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="/admin/js-yaml.min.js"></script>
  <script src="/admin/decap-cms.js"></script>
  <script>
    (async function () {
      try {
        var CMS = window.decapCms || window.CMS;
        cmsDiag("Decap loaded: " + (CMS ? "yes" : "NO") + ", js-yaml: " + (window.jsyaml ? "yes" : "NO"));
        if (!CMS || !window.jsyaml) { cmsDiagOverlay(); return; }
        cmsDiag("Fetching config.yml…");
        var res = await fetch("/admin/config.yml");
        if (!res.ok) { cmsDiag("config fetch failed: HTTP " + res.status); cmsDiagOverlay(); return; }
        var yamlText = await res.text();
        cmsDiag("config OK (" + yamlText.length + " chars), parsing YAML…");
        var config = window.jsyaml.load(yamlText);
        cmsDiag("config parsed: " + (config && config.backend && config.collections ? "yes" : "NO"));
        if (!config || !config.backend || !config.collections) { cmsDiagOverlay(); return; }
        window.__cmsBaseUrl = config.backend.base_url;
        if (window.__cmsPanelAdd) {
          window.__cmsPanelAdd("backend: base_url=" + config.backend.base_url + " | auth_endpoint=" + config.backend.auth_endpoint + " | repo=" + config.backend.repo + " | branch=" + config.backend.branch);
        }
        cmsDiag("Initializing CMS…");
        await CMS.init({ config: config });
        cmsDiag("CMS.init completed");
      } catch (e) {
        cmsDiag("init error: " + (e && (e.message || e)) + " ");
      }
      setTimeout(function () {
        var m = document.querySelector(".nc-root, #nc-root, [class*='nc-']");
        if (m) {
          console.log("[cms-diag] Editor mounted OK");
        } else {
          cmsDiag("Editor did not mount UI after 8s");
          cmsDiagOverlay();
        }
      }, 8000);
    })();
  </script>
</body>
</html>
