<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager</title>
  <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
  <link rel="stylesheet" href="/admin/cms.css" />
  <script>
    (function () {
      var box = null;
      function ensureBox() {
        if (!box) {
          box = document.createElement("div");
          box.id = "cms-error";
          box.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483000;background:#111;color:#ff6b6b;border:1px solid #ff6b6b;border-radius:8px;padding:12px;font:12px/1.5 monospace;white-space:pre-wrap;max-height:40vh;overflow:auto;";
          document.body.appendChild(box);
        }
        return box;
      }
      window.addEventListener("error", function (e) {
        ensureBox().textContent = "ERROR: " + (e.message || "unknown") + (e.filename ? " at " + e.filename + ":" + e.lineno : "");
      });
      window.addEventListener("unhandledrejection", function (e) {
        ensureBox().textContent = "UNHANDLED ERROR: " + (((e.reason && (e.reason.message || e.reason)) || e.reason) + " ");
      });
    })();
  </script>
</head>
<body>
  <noscript>Your browser needs JavaScript enabled to use the content manager.</noscript>
  <script src="/admin/decap-cms.js"></script>
</body>
</html>
